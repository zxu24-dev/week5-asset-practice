<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diatom Guy</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .scene {
      position: fixed;
      inset: 0;
      transition: opacity 0.8s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- Scene 1 ---------- */

    #scene1 {
      background: #000 url("assets/inside-scene.jpg") center / cover no-repeat;
    }

    /* the diatom guy, standing on the left */
    #guy {
      position: absolute;
      left: 5vw;
      bottom: 4vh;
      width: min(38vw, 62vh);
      touch-action: none;
    }

    #guy img {
      width: 100%;
    }

    #guy.wearing-hat {
      cursor: grab;
    }

    #guy.dragging {
      cursor: grabbing;
      z-index: 10;
    }

    /* the floating hat; the wrapper crops away the empty space around it
       (hat.png's visible area is x 222-1180, y 310-1050 of 1423x1387) */
    #hat {
      position: absolute;
      left: calc(5vw + min(38vw, 62vh) * 0.25);
      bottom: calc(4vh + min(38vw, 62vh) * 0.86);
      width: calc(min(38vw, 62vh) * 0.5);
      aspect-ratio: 958 / 740;
      overflow: hidden;
      cursor: pointer;
      animation: bob 2s ease-in-out infinite;
      transition: opacity 0.4s ease;
    }

    #hat img {
      position: absolute;
      width: calc(1423 / 958 * 100%);
      left: calc(-222 / 958 * 100%);
      top: calc(-310 / 740 * 100%);
    }

    #door {
      position: absolute;
      right: 8vw;
      bottom: 4vh;
      height: 60vh;
      transition: opacity 0.8s ease;
    }

    /* ---------- Scene 2 ---------- */

    #scene2 {
      background: #000;
    }

    #house {
      position: absolute;
      left: 6vw;
      top: 50%;
      height: 90vh;
      transform: translateY(-50%);
    }

    /* house.png is 771x1488, so its width is 90vh * 771/1488 */
    #guy2 {
      position: absolute;
      left: calc(6vw + 90vh * 771 / 1488 * 0.15);
      top: 38vh;
      width: calc(90vh * 771 / 1488 * 0.7);
      transition: opacity 0.6s ease;
    }

    #guy2 img {
      width: 100%;
    }

    #car {
      position: absolute;
      right: 6vw;
      bottom: 3vh;
      width: min(48vw, 640px);
      cursor: pointer;
    }

    #car img {
      width: 100%;
    }

    #car.driving {
      cursor: default;
    }

    #car.shaking img {
      animation: shake 0.12s linear infinite;
    }

    #car.leaving {
      transform: translateX(110vw);
      transition: transform 2s cubic-bezier(0.5, 0, 0.9, 0.4);
    }

    /* ---------- Animations ---------- */

    .bobbing {
      animation: bob 2s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    @keyframes shake {
      0%   { transform: translate(0, 0) rotate(0deg); }
      25%  { transform: translate(-2px, 1px) rotate(-0.5deg); }
      50%  { transform: translate(2px, -1px) rotate(0.5deg); }
      75%  { transform: translate(-1px, -1px) rotate(0deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>
</head>
<body>

  <!-- Scene 1: inside the room -->
  <div id="scene1" class="scene">
    <img id="door" class="hidden" src="assets/door.png" alt="Door">
    <div id="guy">
      <img id="guy-img" src="assets/diatom-guy.png" alt="Diatom guy">
    </div>
    <div id="hat">
      <img src="assets/hat.png" alt="Hat">
    </div>
  </div>

  <!-- Scene 2: outside the house -->
  <div id="scene2" class="scene hidden">
    <img id="house" src="assets/house.png" alt="House">
    <div id="guy2">
      <img class="bobbing" src="assets/diatom-guy-with-hat.png" alt="Diatom guy with hat">
    </div>
    <div id="car">
      <img id="car-img" src="assets/car.png" alt="Car">
    </div>
  </div>

  <script>
    // preload the swapped-in images so they appear instantly
    ["assets/diatom-guy-with-hat.png", "assets/car-with-driver.png"].forEach(function (src) {
      new Image().src = src;
    });

    var scene1 = document.getElementById("scene1");
    var scene2 = document.getElementById("scene2");
    var guy = document.getElementById("guy");
    var guyImg = document.getElementById("guy-img");
    var hat = document.getElementById("hat");
    var door = document.getElementById("door");
    var guy2 = document.getElementById("guy2");
    var car = document.getElementById("car");
    var carImg = document.getElementById("car-img");

    // ---------- Scene 1: click the hat ----------

    var hatOn = false;

    hat.addEventListener("click", function () {
      if (hatOn) return;
      hatOn = true;

      guyImg.src = "assets/diatom-guy-with-hat.png";
      guyImg.classList.add("bobbing");
      guy.classList.add("wearing-hat");
      hat.classList.add("hidden");
      door.classList.remove("hidden");
    });

    // ---------- Scene 1: drag the guy to the door ----------

    var dragging = false;
    var offsetX = 0;
    var offsetY = 0;

    guy.addEventListener("pointerdown", function (e) {
      if (!hatOn) return;
      dragging = true;
      guy.setPointerCapture(e.pointerId);
      guy.classList.add("dragging");

      // switch from CSS left/bottom to pixel left/top so we can move it
      var rect = guy.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      guy.style.transition = "none";
      guy.style.left = rect.left + "px";
      guy.style.top = rect.top + "px";
      guy.style.bottom = "auto";
    });

    guy.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      guy.style.left = (e.clientX - offsetX) + "px";
      guy.style.top = (e.clientY - offsetY) + "px";
    });

    guy.addEventListener("pointerup", function (e) {
      if (!dragging) return;
      dragging = false;
      guy.classList.remove("dragging");

      if (isOverDoor(e.clientX, e.clientY)) {
        startScene2();
      } else {
        // slide back to where he started
        guy.style.transition = "left 0.4s ease, top 0.4s ease";
        guy.style.left = "";
        guy.style.top = "";
        guy.style.bottom = "";
      }
    });

    // true if the pointer, or the middle of the guy, is over the door
    function isOverDoor(x, y) {
      var d = door.getBoundingClientRect();
      var g = guy.getBoundingClientRect();
      var cx = g.left + g.width / 2;
      var cy = g.top + g.height * 0.6;

      function inside(px, py) {
        return px > d.left && px < d.right && py > d.top && py < d.bottom;
      }
      return inside(x, y) || inside(cx, cy);
    }

    // ---------- Scene 2 ----------

    function startScene2() {
      scene1.classList.add("hidden");
      scene2.classList.remove("hidden");
    }

    var carClicked = false;

    car.addEventListener("click", function () {
      if (carClicked) return;
      carClicked = true;

      guy2.classList.add("hidden");
      carImg.src = "assets/car-with-driver.png";
      car.classList.add("driving", "shaking");

      // after a second the car drives off to the right
      setTimeout(function () {
        car.classList.add("leaving");
      }, 1000);
    });
  </script>

</body>
</html>
